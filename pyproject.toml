[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiortc-native-sctp"
version = "0.1.0"
description = "Native usrsctp transport replacement for aiortc RTCDataChannel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiortc",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
